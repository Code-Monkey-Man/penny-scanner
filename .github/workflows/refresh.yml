# Refreshes penny-list.json every morning and commits it. GitHub Pages then serves the new list.
# Run it by hand anytime: Actions tab -> "Refresh penny list" -> Run workflow.
name: Refresh penny list
on:
  schedule:
    - cron: "17 11 * * *"   # 6:17 AM Central (5:17 during daylight time)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Rebuild list
        run: python3 update_list.py
      - name: Commit if changed
        run: |
          git config user.name "penny-bot"
          git config user.email "penny-bot@users.noreply.github.com"
          git add penny-list.json
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Penny list refresh $(date -u +%Y-%m-%d)"
          git push
